<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 32" width="170" height="32" role="img" aria-label="Status: fixed">
  <style>
    @keyframes ring { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes blip { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 1.9s ease-out infinite; }
    .dot  { animation: blip 1.9s ease-in-out infinite; }
  </style>
  <rect width="170" height="32" rx="16" fill="#10151c" stroke="#2b3440" stroke-width="1"/>
  <circle class="ring" cx="24" cy="16" r="7" fill="none" stroke="#3fb950" stroke-width="2"/>
  <circle class="dot" cx="24" cy="16" r="4.5" fill="#3fb950"/>
  <text x="40" y="21" font-family="'Cascadia Code',Consolas,monospace" font-size="12.5" fill="#8b949e">STATUS: FIXED</text>
</svg>
