<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260" role="img" aria-label="火箭发射 — 快速开始">
  <style>
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes flicker { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.72); } }
    @keyframes puff { 0% { transform: scale(0.3); opacity: 0.8; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes glowpulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }

    .rocket  { animation: bob 2.6s ease-in-out infinite; }
    .flame1  { transform-box: fill-box; transform-origin: top center; animation: flicker 0.28s ease-in-out infinite; }
    .flame2  { transform-box: fill-box; transform-origin: top center; animation: flicker 0.42s ease-in-out 0.1s infinite; }
    .flame3  { transform-box: fill-box; transform-origin: top center; animation: flicker 0.34s ease-in-out 0.05s infinite; }
    .puff    { animation: puff 2.4s ease-out infinite; }
    .star    { animation: twinkle 2.8s ease-in-out infinite; }
    .glowbig { animation: glowpulse 4s ease-in-out infinite; }
  </style>
  <defs>
    <radialGradient id="bgG">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A63"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
  </defs>

  <circle cx="110" cy="120" r="104" fill="url(#bgG)" class="glowbig"/>

  <!-- twinkling stars -->
  <circle cx="60" cy="52" r="1.8" fill="#e6edf3" class="star" style="animation-delay:0s"/>
  <circle cx="168" cy="42" r="2.2" fill="#e6edf3" class="star" style="animation-delay:0.8s"/>
  <circle cx="46" cy="122" r="1.6" fill="#e6edf3" class="star" style="animation-delay:1.6s"/>
  <circle cx="184" cy="128" r="1.7" fill="#e6edf3" class="star" style="animation-delay:0.4s"/>
  <circle cx="96" cy="30" r="1.5" fill="#e6edf3" class="star" style="animation-delay:2.2s"/>
  <circle cx="150" cy="74" r="1.8" fill="#e6edf3" class="star" style="animation-delay:1.1s"/>

  <!-- smoke puffs -->
  <circle class="puff" cx="88" cy="228" r="9" fill="#8b949e" style="animation-delay:0s"/>
  <circle class="puff" cx="110" cy="234" r="11" fill="#8b949e" style="animation-delay:0.9s"/>
  <circle class="puff" cx="132" cy="228" r="9" fill="#8b949e" style="animation-delay:1.8s"/>

  <!-- rocket -->
  <g class="rocket">
    <!-- flames -->
    <path class="flame1" d="M110 152 L98 186 Q110 198 122 186 Z" fill="#FF8A3D"/>
    <path class="flame2" d="M110 152 L103 178 Q110 188 117 178 Z" fill="#FFC9A3"/>
    <path class="flame3" d="M110 152 L107 172 Q110 180 113 172 Z" fill="#ffffff"/>

    <!-- fins -->
    <path d="M82 118 L60 130 L84 140 Z" fill="#B85A3E"/>
    <path d="M138 118 L160 130 L136 140 Z" fill="#B85A3E"/>

    <!-- body -->
    <path d="M110 22 L136 56 Q138 60 138 66 V140 Q138 152 110 152 Q82 152 82 140 V66 Q82 60 84 56 Z" fill="url(#bodyGrad)"/>

    <!-- window -->
    <circle cx="110" cy="88" r="14" fill="#0d1117" stroke="#FFC9A3" stroke-width="3"/>
    <circle cx="104" cy="82" r="5" fill="#FFC9A3" opacity="0.55"/>
  </g>
</svg>
