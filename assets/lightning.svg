<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 210" width="150" height="210" role="img" aria-label="闪电动画 — 危险模式">
  <style>
    @keyframes flash { 0%, 100% { opacity: 0.9; } 8% { opacity: 0.35; } 16% { opacity: 1; } 28% { opacity: 0.5; } 45% { opacity: 0.95; } 70% { opacity: 0.7; } }
    @keyframes ring { 0% { transform: scale(0.3); opacity: 0.8; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes blip { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .bolt { animation: flash 1.9s ease-in-out infinite; }
    .ring1 { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .ring2 { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out 0.8s infinite; }
    .ring3 { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out 1.6s infinite; }
    .spark { animation: blip 1.2s ease-in-out infinite; }
    .modetext { animation: blip 2.6s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <radialGradient id="bGlow">
      <stop offset="0" stop-color="#FFD700" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="134" height="194" rx="26" fill="#10151c" stroke="#2b3440" stroke-width="1"/>
  <circle cx="75" cy="105" r="70" fill="url(#bGlow)"/>
  <circle class="ring1" cx="75" cy="105" r="34" fill="none" stroke="#FFD700" stroke-width="2"/>
  <circle class="ring2" cx="75" cy="105" r="34" fill="none" stroke="#FFD700" stroke-width="2"/>
  <circle class="ring3" cx="75" cy="105" r="34" fill="none" stroke="#FFD700" stroke-width="2"/>
  <path class="bolt" d="M88 30 L58 98 L80 98 L62 168 L112 90 L88 90 L110 30 Z" fill="url(#boltGrad)"/>
  <circle class="spark" cx="62" cy="176" r="3" fill="#FFD700" style="animation-delay:0s"/>
  <circle class="spark" cx="80" cy="184" r="2.4" fill="#FF8A3D" style="animation-delay:0.5s"/>
  <circle class="spark" cx="96" cy="176" r="2.8" fill="#FFD700" style="animation-delay:1s"/>
  <text class="modetext" x="75" y="196" text-anchor="middle" font-family="'Cascadia Code',Consolas,monospace" font-size="10" letter-spacing="3" fill="#ffa657">DANGER MODE</text>
</svg>
