<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" width="460" height="150" role="img" aria-label="Claude Boot Fixer 数据一览">
  <style>
    @keyframes grow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes softpulse {
      0%, 100% { opacity: 0.9; }
      50%      { opacity: 1; }
    }
    .bar   { transform-box: fill-box; transform-origin: left center; animation: grow 1.4s cubic-bezier(.22,.9,.35,1) backwards; }
    .b1    { animation-delay: 0.15s; }
    .b2    { animation-delay: 0.55s; }
    .b3    { animation-delay: 0.95s; }
    .barfill { animation: softpulse 2.6s ease-in-out infinite; }
    .val   { animation: grow 0.8s ease-out backwards; }
    .v1    { animation-delay: 1.05s; }
    .v2    { animation-delay: 1.25s; }
    .v3    { animation-delay: 1.45s; }
  </style>
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#FFB08A"/>
    </linearGradient>
  </defs>

  <!-- row 1 -->
  <text x="16" y="32" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#8b949e">自动修复成功率</text>
  <rect x="150" y="20" width="260" height="14" rx="7" fill="#1b2431"/>
  <rect class="bar b1" x="150" y="20" width="257" height="14" rx="7" fill="url(#barGrad)"/>
  <rect class="barfill" x="150" y="20" width="257" height="14" rx="7" fill="url(#barGrad)" opacity="0.9"/>
  <text class="val v1" x="424" y="32" text-anchor="end" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#FFB08A">99%</text>

  <!-- row 2 -->
  <text x="16" y="78" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#8b949e">覆盖问题场景</text>
  <rect x="150" y="66" width="260" height="14" rx="7" fill="#1b2431"/>
  <rect class="bar b2" x="150" y="66" width="221" height="14" rx="7" fill="url(#barGrad)"/>
  <text class="val v2" x="424" y="78" text-anchor="end" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#FFB08A">12+ 类</text>

  <!-- row 3 -->
  <text x="16" y="124" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#8b949e">开源 · 永久免费</text>
  <rect x="150" y="112" width="260" height="14" rx="7" fill="#1b2431"/>
  <rect class="bar b3" x="150" y="112" width="260" height="14" rx="7" fill="#3fb950"/>
  <text class="val v3" x="424" y="124" text-anchor="end" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#3fb950">100% FREE</text>
</svg>
