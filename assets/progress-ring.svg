<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 190" width="190" height="190" role="img" aria-label="修复成功率 99% 圆环">
  <style>
    @keyframes draw { to { stroke-dashoffset: 17; } }
    @keyframes spinrev { to { transform: rotate(-360deg); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.55); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes glowpulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    .arc { stroke-dasharray: 440; stroke-dashoffset: 440; animation: draw 1.8s cubic-bezier(.22,.9,.35,1) 0.3s forwards; }
    .halo { transform-box: fill-box; transform-origin: center; animation: spinrev 18s linear infinite; }
    .num { transform-box: fill-box; transform-origin: center; animation: pop 0.7s cubic-bezier(.22,.9,.35,1) 1.5s backwards; }
    .glowbig { animation: glowpulse 4s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#FFC9A3"/>
    </linearGradient>
    <radialGradient id="rGlow">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="95" cy="95" r="90" fill="url(#rGlow)" class="glowbig"/>
  <circle class="halo" cx="95" cy="95" r="80" fill="none" stroke="#FFC9A3" stroke-width="1.5" stroke-dasharray="3 12" opacity="0.55"/>
  <circle cx="95" cy="95" r="68" fill="#10151c" stroke="#2b3440" stroke-width="1"/>
  <circle class="arc" cx="95" cy="95" r="68" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 95 95)"/>
  <text class="num" x="95" y="103" text-anchor="middle" font-family="'Cascadia Code',Consolas,monospace" font-size="30" font-weight="700" fill="#FFC9A3">99%</text>
  <text class="num" x="95" y="128" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" fill="#8b949e" style="animation-delay:1.7s">FIX RATE</text>
</svg>
